<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found – Postin</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f1efea" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; font-display: swap; src: url("/fonts/pjs-400.woff2") format("woff2"); }
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; font-display: swap; src: url("/fonts/pjs-800.woff2") format("woff2"); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f1efea; color: #111; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
      .box { background: #fff; border-radius: 14px; padding: 40px 32px; max-width: 420px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08); }
      img { width: 56px; height: 56px; }
      h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin: 18px 0 6px; }
      p { color: #6b6b6b; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; background: #111; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; padding: 14px 24px; border-radius: 12px; }
      a:hover { background: #2a2a2a; }
      a:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="box">
      <img src="/logo.png" alt="Postin logo" width="56" height="56" />
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist. Head back and make your next design post.</p>
      <a href="/">Back to Postin</a>
    </main>
  </body>
</html>
