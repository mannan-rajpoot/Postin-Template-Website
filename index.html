    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/pjs-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/pjs-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/pjs-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url("/fonts/pjs-800.woff2") format("woff2");
      }
      :root {
        --bg: #f1efea;
        --panel: #ffffff;
        --ink: #111;
        --muted: #6b6b6b;
        --line: #e4e1da;
        --accent: #111;
        --font:
          "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI",
          Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        padding: clamp(12px, 2vw, 32px);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .app {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 560px);
        gap: clamp(20px, 3vw, 48px);
        align-items: start;
      }
      .preview {
        position: sticky;
        top: clamp(12px, 2vw, 32px);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
      }
      .frame {
        /* canvas is 4:5 — size it so the whole post always fits the screen height */
        width: min(100%, calc((100vh - 110px - 4vw) * 0.8 + 24px));
        width: min(100%, calc((100dvh - 110px - 4vw) * 0.8 + 24px));
      }
      .frame {
        background: #fff;
        border-radius: 14px;
        padding: 12px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 12px 40px rgba(0, 0, 0, 0.08);
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
        text-align: center;
        margin: 10px 0 0;
      }
      .panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 26px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 22px;
      }
      label.f {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      input[type="text"],
      textarea,
      select {
        width: 100%;
        font: inherit;
        font-size: 15px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfaf8;
        color: var(--ink);
        outline: none;
      }
      textarea {
        resize: vertical;
        min-height: 92px;
        line-height: 1.5;
      }
      input[type="text"]:focus,
      textarea:focus,
      select:focus {
        border-color: #111;
        background: #fff;
      }
      .drop {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1.5px dashed #c9c5bb;
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        background: #fbfaf8;
        transition: 0.15s;
      }
      .drop:hover,
      .drop.over {
        border-color: #111;
        background: #fff;
      }
      .drop .ic {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #111;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        flex: none;
      }
      .drop b {
        display: block;
        font-size: 14px;
      }
      .drop span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .drop input {
        display: none;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .range {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .range input {
        flex: 1;
        accent-color: #111;
      }
      .range output {
        font-size: 12.5px;
        color: var(--muted);
        min-width: 42px;
        text-align: right;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
        margin-top: 16px;
        cursor: pointer;
      }
      .check input {
        width: 17px;
        height: 17px;
        accent-color: #111;
      }
      details {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 0;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "+";
        float: right;
        font-weight: 400;
        font-size: 18px;
      }
      details[open] summary::after {
        content: "–";
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        border-radius: 12px;
        padding: 14px 22px;
        cursor: pointer;
        border: 1px solid #111;
      }
      .btn-main {
        background: #111;
        color: #fff;
        flex: 1;
        min-width: 200px;
      }
      .btn-main:hover {
        background: #2a2a2a;
      }
      .btn-ghost {
        background: #fff;
        color: #111;
        border-color: var(--line);
      }
      .btn-ghost:hover {
        border-color: #111;
      }
      button:focus-visible,
      summary:focus-visible,
      .drop:focus-visible {
        outline: 2px solid #111;
        outline-offset: 2px;
      }
      .small {
        font-size: 12.5px;
        padding: 8px 12px;
        border-radius: 9px;
      }
      .inline {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .avthumb {
        border-radius: 50% !important;
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      .panel {
        min-width: 0;
      }
      .colors {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .themes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
      }
      .theme {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
        text-align: left;
        min-width: 0;
      }
      .theme:hover {
        border-color: #111;
      }
      .theme i {
        display: block;
        height: 44px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        font-style: normal;
        font-weight: 800;
        font-size: 17px;
        line-height: 44px;
        text-align: center;
        letter-spacing: -0.02em;
      }
      .theme i em {
        font-style: normal;
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfaf8;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        min-width: 0;
      }
      .swatch:hover {
        border-color: #111;
      }
      .swatch input[type="color"] {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        cursor: pointer;
        flex: none;
      }
      .swatch input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .swatch input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 7px;
      }
      .swatch input[type="color"]::-moz-color-swatch {
        border: 0;
        border-radius: 7px;
      }
      .swatch span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      img,
      canvas {
        max-width: 100%;
      }

      /* tablet + mobile: single column, preview on top */
      @media (max-width: 1000px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
          max-width: 720px;
        }
        .preview {
          position: static;
        }
        .frame {
          width: 100%;
        }
        .panel {
          padding: 22px;
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }
        .frame {
          padding: 8px;
          border-radius: 12px;
        }
        .panel {
          padding: 18px 16px;
          border-radius: 12px;
        }
        h1 {
          font-size: 20px;
        }
        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
        /* 16px inputs stop iOS from zooming on focus */
        input[type="text"],
        textarea,
        select {
          font-size: 16px;
        }
        .actions {
          flex-direction: column;
        }
        .btn-main,
        .btn-ghost {
          width: 100%;
          min-width: 0;
        }
        button {
          padding: 15px 18px;
        }
      }
      @media (hover: none) {
        .range input {
          height: 28px;
        }
      }

      /* ---------- Postin additions ---------- */
      .skip {
        position: absolute;
        left: -9999px;
        top: 8px;
        background: #111;
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        z-index: 10;
        font-size: 14px;
      }
      .skip:focus {
        left: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 6px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        flex: none;
        display: block;
      }
      .brand h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .ico {
        width: 1em;
        height: 1em;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .drop .ic .ico {
        width: 22px;
        height: 22px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }
      button .ico {
        width: 18px;
        height: 18px;
      }
      button:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .theme.active {
        border-color: #111;
        box-shadow: 0 0 0 1px #111;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: #111;
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 20;
        max-width: calc(100vw - 32px);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#controls">Skip to controls</a>
    <main>
      <div class="app">
        <!-- LIVE PREVIEW (this is exactly what gets downloaded) -->
        <section class="preview">
          <div class="frame">
            <canvas
              id="cv"
              width="1080"
              height="1350"
              role="img"
              aria-label="Live preview of your 4:5 Instagram post"
            ></canvas>
          </div>
          <p class="hint" aria-live="polite">
            Live preview · exports at 4:5 (1080×1350 or higher)
          </p>
        </section>

        <!-- CONTROLS -->
        <section class="panel" id="controls" aria-label="Post settings">
          <div class="brand">
            <img src="/logo.png" alt="Postin logo" width="40" height="40" decoding="async" />
            <h1>Postin</h1>
          </div>
          <p class="sub">
            Free Instagram design post maker. Change the text and image — the
            layout stays perfectly consistent every time.
          </p>

          <label class="f" for="cat">Category label</label>
          <input
            type="text"
            id="cat"
            data-k="cat"
            maxlength="40"
            placeholder="e.g. Finance App"
          />

          <label class="f" for="title"
            >App / project name
            <span style="font-weight: 400; color: #888"
              >(Enter = new line)</span
            ></label
          >
          <textarea
            id="title"
            data-k="title"
            rows="2"
            placeholder="e.g. Personal Finance&#10;Mobile App"
          ></textarea>

          <label class="f" for="desc">Short description</label>
          <textarea
            id="desc"
            data-k="desc"
            rows="3"
            placeholder="2–3 short lines about the design…"
          ></textarea>

          <label class="f" id="uiLbl">UI/UX design image</label>
          <label class="drop" id="drop" tabindex="0" aria-labelledby="uiLbl">
            <div class="ic">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4" />
                <path d="m7 9 5-5 5 5" />
                <path d="M5 20h14" />
              </svg>
            </div>
            <div>
              <b id="dropTitle">Upload your UI/UX design</b
              ><span>Click or drag &amp; drop · PNG / JPG / WebP</span>
            </div>
            <input type="file" id="uiFile" accept="image/*" />
          </label>

          <div class="row">
            <div>
              <label class="f" for="fit">Image fit</label>
              <select id="fit" data-k="fit">
                <option value="fill">Fill frame (same size, always)</option>
                <option value="fit">Fit inside (show whole image)</option>
              </select>
            </div>
            <div>
              <label class="f" for="valign">Image position</label>
              <select id="valign" data-k="valign">
                <option value="center">Center</option>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label class="f">Image size</label>
              <div class="range">
                <input
                  type="range"
                  id="scale"
                  data-k="scale"
                  min="60"
                  max="130"
                  step="1"
                /><output id="scaleO"></output>
              </div>
            </div>
            <div>
              <label class="f">Image up / down</label>
              <div class="range">
                <input
                  type="range"
                  id="offy"
                  data-k="offy"
                  min="-120"
                  max="120"
                  step="1"
                /><output id="offyO"></output>
              </div>
            </div>
          </div>

          <label class="check"
            ><input type="checkbox" id="blend" data-k="blend" /> Blend white

          <label class="f" style="margin-top: 22px">Theme presets</label>

          <label class="f" style="margin-top: 22px">Custom colors</label>
          <div class="colors">

            >
            <label class="swatch"

            <div class="inline" style="margin: 0 0 4px">

                  <path d="M10 11v6M14 11v6" />

          <details>
            <summary>

            <div class="row">
              <div>

                ><input type="text" id="tl" data-k="tl" maxlength="40" />

                <label class="f" for="tr">Top-right text</label
                ><input type="text" id="tr" data-k="tr" maxlength="40" />

              <input
                type="range"

            <div class="row">
              <div>
                <label class="f" for="exp">Export quality</label>
                <select id="exp" data-k="exp">
                  <option value="1">1080 × 1350 (Instagram)</option>
                  <option value="2">2160 × 2700 (High)</option>

          <div class="actions">

              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">

              ><span>Download post image</span>
            </button>
            <button class="btn-ghost" id="reset" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p style="text-align: center; padding: 24px">
        Postin needs JavaScript enabled to create your post image.
      </p>
    </noscript>

    <script>
      (function () {
        const W = 1080,
          H = 1350;
        const FONT =
          "'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif";

        const DEFAULTS = {
          cat: "",
          title: "",
          desc: "",
          tl: "",
          tr: "",
          handle: "",
          bg: "#f6f4ef",
          ink: "#0d0d0d",
          dcol: "#666666",
          pill: "#e9e7e2",
          acc: "#8a8780",
          tone: "off",
          fit: "fill",
          valign: "center",
          blend: true,
          scale: 100,
          offy: 0,
          tsize: 70,
          avzoom: 100,
          exp: "2",
          fmt: "png",
        };

        /* ---------- storage (safe) ---------- */
        const KEY = "postin_settings_v1",
          AVKEY = "postin_avatar_v1",
          OLDKEY = "igpost_template_v2",
          OLDAVKEY = "igpost_template_avatar";
        // migrate settings saved by the previous version
        try {
          if (!localStorage.getItem(KEY) && localStorage.getItem(OLDKEY))
            localStorage.setItem(KEY, localStorage.getItem(OLDKEY));
          if (!localStorage.getItem(AVKEY) && localStorage.getItem(OLDAVKEY))
            localStorage.setItem(AVKEY, localStorage.getItem(OLDAVKEY));
        } catch (e) {}
        const USER_ICON =
          '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
        function toast(msg) {
          const t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(() => t.classList.remove("show"), 2600);
        }
        function load() {
          try {
            return JSON.parse(localStorage.getItem(KEY)) || {};
          } catch (e) {
            return {};
          }
        }
        function save() {
          try {
            localStorage.setItem(KEY, JSON.stringify(S));
          } catch (e) {}
        }

        let S = Object.assign({}, DEFAULTS, load());
        let uiImg = null,
          avImg = null;

        const cv = document.getElementById("cv");
        const ctx = cv.getContext("2d");

        /* ---------- helpers ---------- */
        function rr(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y);
          c.arcTo(x + w, y, x + w, y + h, r);
          c.arcTo(x + w, y + h, x, y + h, r);
          c.arcTo(x, y + h, x, y, r);
          c.arcTo(x, y, x + w, y, r);
          c.closePath();
        }
        function wrap(c, text, maxW) {
          const out = [];
          String(text)
            .split("\n")
            .forEach((par) => {
              const words = par.split(/\s+/).filter(Boolean);
              if (!words.length) {
                out.push("");
                return;
              }
              let line = words[0];
              for (let i = 1; i < words.length; i++) {
                const t = line + " " + words[i];
                if (c.measureText(t).width <= maxW) line = t;
                else {
                  out.push(line);
                  line = words[i];
                }
              }
              out.push(line);
            });
          return out;
        }
        // title tokens: words wrapped in [brackets] get the highlight color
        function parseTitle(text) {
          const paras = [];
          let acc = false;
          String(text)
            .split("\n")
            .forEach((p) => {
              const toks = [];
              let cur = "";
              const flush = () => {
                if (cur) {
                  toks.push({ w: cur, acc: acc });
                  cur = "";
                }
              };
              for (const ch of p) {
                if (ch === "[") {
                  flush();
                  acc = true;
                } else if (ch === "]") {
                  flush();
                  acc = false;
                } else if (/\s/.test(ch)) flush();
                else cur += ch;
              }
              flush();
              paras.push(toks);
            });
          return paras;
        }
        function wrapTokens(c, paras, maxW) {
          const lines = [];
          paras.forEach((toks) => {
            if (!toks.length) {
              lines.push([]);
              return;
            }
            let line = [toks[0]];
            for (let i = 1; i < toks.length; i++) {
              const t = line
                .concat(toks[i])
                .map((o) => o.w)
                .join(" ");
              if (c.measureText(t).width <= maxW) line.push(toks[i]);
              else {
                lines.push(line);
                line = [toks[i]];
              }
            }
            lines.push(line);
          });
          return lines;
        }
        // balanced wrap: same line count as greedy, but lines are evenly sized
        function balancedWrap(c, text, maxW) {
          const base = wrap(c, text, maxW);
          if (base.length < 2) return base;
          const n = base.length;
          let lo = maxW * 0.5,
            hi = maxW,
            best = base;
          for (let i = 0; i < 14; i++) {
            const mid = (lo + hi) / 2;
            const t = wrap(c, text, mid);
            if (t.length <= n) {
              best = t;
              hi = mid;
            } else lo = mid;
          }
          return best;
        }
        function spacing(c, v) {
          if ("letterSpacing" in c) c.letterSpacing = v;
        }
        function validColor(v, d) {
          return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? v : d || DEFAULTS.bg;
        }

        /* ---------- main drawing (preview + export use the same function) ---------- */
        function draw(c, k, ghost) {
          // ghost = preview-only hints for empty fields (never exported)
          const GH = "#c4c0b6";
          const INK = validColor(S.ink, DEFAULTS.ink);
          const DCOL = validColor(S.dcol, DEFAULTS.dcol);
          const PILL = validColor(S.pill, DEFAULTS.pill);
          const put = (v, ph, x, y, col) => {
            const t = v || (ghost ? ph : "");
            if (!t) return;
            c.fillStyle = v ? col : GH;
            c.fillText(t, x, y);
          };
          c.setTransform(k, 0, 0, k, 0, 0);
          c.clearRect(0, 0, W, H);
          c.imageSmoothingEnabled = true;
          c.imageSmoothingQuality = "high";
          c.textBaseline = "middle";
          spacing(c, "0px");

          // background
          c.fillStyle = validColor(S.bg);
          c.fillRect(0, 0, W, H);

          // top labels
          c.font = `400 25px ${FONT}`;
          c.textAlign = "left";
          put(S.tl, "Top-left text", 62, 72, DCOL);
          c.textAlign = "right";
          put(S.tr, "Top-right text", W - 62, 72, DCOL);

          // category pill
          const catT = (S.cat || "").trim();
          if (catT || ghost) {
            const label = catT || "Category";
            c.font = `500 21px ${FONT}`;
            const tw = c.measureText(label).width;
            const pw = tw + 56,
              ph = 38,
              px = (W - pw) / 2,
              py = 158 - ph / 2;
            if (catT) {
              c.fillStyle = PILL;
              rr(c, px, py, pw, ph, ph / 2);
              c.fill();
            } else {
              c.save();
              c.setLineDash([6, 6]);
              c.strokeStyle = GH;
              c.lineWidth = 1.5;
              rr(c, px, py, pw, ph, ph / 2);
              c.stroke();
              c.restore();
            }
            c.textAlign = "center";
            put(catT, "Category", W / 2, 159, INK);
          }

          // title
          const ts = +S.tsize || 70;
          c.font = `800 ${ts}px ${FONT}`;
          spacing(c, -ts * 0.03 + "px");
          const ACC = validColor(S.acc, DEFAULTS.acc);
          const rawTitle = S.title || (ghost ? "Your Project\nName Here" : "");
          const tLines = wrapTokens(c, parseTitle(rawTitle), 940);
          const flat = tLines.flat();
          if (S.title && !/[\[\]]/.test(S.title) && S.tone !== "off") {
            const n = flat.length;
            if (S.tone === "half" && n > 1) {
              flat.forEach((t, i) => (t.acc = i >= Math.floor(n / 2)));
            } else if (S.tone === "last" && n > 0) {
              flat[n - 1].acc = true;
            } else if (S.tone === "line2") {
              tLines.forEach((ln, li) => {
                if (li >= 1) ln.forEach((t) => (t.acc = true));
              });
            }
          }
          c.textAlign = "left";
          const lh = ts * 1.07;
          let y = 238;
          tLines.forEach((line) => {
            const sp = c.measureText(" ").width;
            let tot = 0;
            line.forEach((t, i) => {
              tot += c.measureText(t.w).width + (i ? sp : 0);
            });
            let x = W / 2 - tot / 2;
            line.forEach((t) => {
              c.fillStyle = !S.title ? GH : t.acc ? ACC : INK;
              c.fillText(t.w, x, y);
              x += c.measureText(t.w).width + sp;
            });
            y += lh;
          });
          const lastTitleY = y - lh;
          spacing(c, "0px");

          // description
          c.font = `400 27px ${FONT}`;
          c.fillStyle = S.desc ? DCOL : GH;
          c.textAlign = "center";
          const dLines = balancedWrap(
            c,
            S.desc ||
              (ghost
                ? "Write a short description of your design here. It will be centered and balanced automatically."
                : ""),
            760,
          );
          const dlh = 40;
          let dy = lastTitleY + ts * 0.5 + 44;
          dLines.forEach((l) => {
            c.fillText(l, W / 2, dy);
            dy += dlh;
          });
          const descBottom = dy - dlh + 18;

          // UI/UX image
          // fixed frame: every uploaded image gets the exact same box
          const top = Math.max(520, descBottom + 24);
          const bottom = 1185;
          const bx = 10,
            bw = W - 20,
            bh = bottom - top;
          if (uiImg) {
            const iw = uiImg.naturalWidth,
              ih = uiImg.naturalHeight;
            const base =
              S.fit === "fit"
                ? Math.min(bw / iw, bh / ih)
                : Math.max(bw / iw, bh / ih);
            const fit = base * (S.scale / 100);
            const dw = iw * fit,
              dh = ih * fit;
            const dx = bx + (bw - dw) / 2;
            let dyy =
              S.valign === "top"
                ? top
                : S.valign === "bottom"
                  ? top + bh - dh
                  : top + (bh - dh) / 2;
            dyy += +S.offy || 0;
            c.save();
            c.beginPath();
            c.rect(bx, top, bw, bh);
            c.clip();
            if (S.blend) c.globalCompositeOperation = "multiply";
            c.drawImage(uiImg, dx, dyy, dw, dh);
            c.restore();
          } else if (ghost) {
            c.save();
            c.setLineDash([10, 10]);
            c.strokeStyle = "#c9c5bb";
            c.lineWidth = 2;
            rr(c, 90, top + 10, W - 180, bh - 20, 36);
            c.stroke();
            c.setLineDash([]);
            c.fillStyle = "#9a968c";
            c.textAlign = "center";
            c.font = `600 30px ${FONT}`;
            c.fillText("Upload your UI/UX design", W / 2, top + bh / 2 - 4);
            c.font = `400 22px ${FONT}`;
            c.fillText("It will appear here", W / 2, top + bh / 2 + 34);
            c.restore();
          }

          // footer: avatar
          const ax = 104,
            ay = 1251,
            ar = 44;
          c.save();
          c.beginPath();
          c.arc(ax, ay, ar, 0, Math.PI * 2);
          c.closePath();
          c.clip();
          if (avImg) {
            const s =
              Math.max(
                (2 * ar) / avImg.naturalWidth,
                (2 * ar) / avImg.naturalHeight,
              ) *
              ((+S.avzoom || 100) / 100);
            const w = avImg.naturalWidth * s,
              h = avImg.naturalHeight * s;
            c.drawImage(avImg, ax - w / 2, ay - h / 2, w, h);
          } else {
            c.fillStyle = "#141414";
            c.fillRect(ax - ar, ay - ar, ar * 2, ar * 2);
            c.fillStyle = "#4a4a4a";
            c.beginPath();
            c.arc(ax, ay - 9, 14, 0, Math.PI * 2);
            c.fill();
            c.beginPath();
            c.ellipse(ax, ay + 34, 28, 24, 0, 0, Math.PI * 2);
            c.fill();
          }
          c.restore();

          // divider
          c.strokeStyle = DCOL;
          c.globalAlpha = 0.6;
          c.lineWidth = 1.6;
          c.beginPath();
          c.moveTo(171, ay - 15);
          c.lineTo(171, ay + 15);
          c.stroke();
          c.globalAlpha = 1;

          // handle
          c.font = `500 27px ${FONT}`;
          c.textAlign = "left";
          put(S.handle, "your.handle", 194, ay + 1, INK);

          // swipe →
          const rx = W - 62;
          c.font = `500 25px ${FONT}`;
          c.fillStyle = DCOL;
          c.textAlign = "right";
          c.fillText("Swipe", rx - 40, ay + 1);
          c.strokeStyle = DCOL;
          c.lineWidth = 2.2;
          c.lineCap = "round";
          c.lineJoin = "round";
          c.beginPath();
          c.moveTo(rx - 26, ay + 1);
          c.lineTo(rx, ay + 1);
          c.stroke();
          c.beginPath();
          c.moveTo(rx - 10, ay - 9);
          c.lineTo(rx, ay + 1);
          c.lineTo(rx - 10, ay + 11);
          c.stroke();
        }

        // throttle redraws to one per frame so sliders stay smooth on phones
        let raf = 0;
        function render() {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            draw(ctx, 1, true);
          });
        }

        /* ---------- fonts ---------- */
        let fontsReady = Promise.resolve();
        if (document.fonts && document.fonts.load) {
          fontsReady = Promise.all([
            document.fonts.load(`400 25px 'Plus Jakarta Sans'`),
            document.fonts.load(`500 25px 'Plus Jakarta Sans'`),
            document.fonts.load(`600 30px 'Plus Jakarta Sans'`),
            document.fonts.load(`800 70px 'Plus Jakarta Sans'`),
          ])
            .then(render)
            .catch(() => {});
          document.fonts.ready.then(render);
        }

        /* ---------- bind controls ---------- */
        document.querySelectorAll("[data-k]").forEach((el) => {
          const k = el.dataset.k;
          if (el.type === "checkbox") el.checked = !!S[k];
          else el.value = S[k];
          const out = document.getElementById(el.id + "O");
          const upd = () => {
            if (out)
              out.textContent =
                k === "scale" || k === "avzoom"
                  ? el.value + "%"
                  : el.value + (k === "tsize" ? "px" : "");
          };
          upd();
          const handler = () => {
            S[k] =
              el.type === "checkbox"
                ? el.checked
                : el.type === "range"
                  ? +el.value
                  : el.value;
            upd();
            save();
            render();
          };
          el.addEventListener("input", handler);
          el.addEventListener("change", handler);
        });

        function syncControls() {
          document.querySelectorAll("[data-k]").forEach((el) => {
            const k = el.dataset.k;
            if (el.type === "checkbox") el.checked = !!S[k];
            else el.value = S[k];
            const out = document.getElementById(el.id + "O");
            if (out)
              out.textContent =
                k === "scale" || k === "avzoom"
                  ? el.value + "%"
                  : el.value + (k === "tsize" ? "px" : "");
          });
        }

        /* ---------- image loading ---------- */
        function loadImageFile(file, cb) {
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            toast("Please choose an image file (PNG, JPG or WebP).");
            return;
          }
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            cb(img, file);
            URL.revokeObjectURL(url);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            toast("Couldn't read that image. Try another file.");
          };
          img.src = url;
        }

        const uiFile = document.getElementById("uiFile");
        const drop = document.getElementById("drop");
        const dropTitle = document.getElementById("dropTitle");
        function setUI(file) {
          loadImageFile(file, (img, f) => {
            uiImg = img;
            dropTitle.textContent =
              f.name.length > 34 ? f.name.slice(0, 31) + "…" : f.name;
            render();
          });
        }
        uiFile.addEventListener("change", (e) => {
          setUI(e.target.files[0]);
          e.target.value = "";
        });
        ["dragenter", "dragover"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.remove("over");
          }),
        );
        drop.addEventListener("drop", (e) => setUI(e.dataTransfer.files[0]));
        drop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            uiFile.click();
          }
        });

        // profile photo (kept in this browser)
        const avDrop = document.getElementById("avDrop");
        ["dragenter", "dragover"].forEach((ev) =>
          avDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            avDrop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          avDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            avDrop.classList.remove("over");
          }),
        );
        avDrop.addEventListener("drop", (e) =>
          handleAvatarFile(e.dataTransfer.files[0]),
        );
        avDrop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            document.getElementById("avFile").click();
          }
        });
        function setAvatar(dataUrl) {
          const img = new Image();
          img.onload = () => {
            avImg = img;
            const t = document.getElementById("avThumb");
            t.textContent = "";
            t.style.background = "url(" + dataUrl + ") center/cover";
            document.getElementById("avTitle").textContent =
              "Change profile photo";
            render();
          };
          img.src = dataUrl;
        }
        try {
          const saved = localStorage.getItem(AVKEY);
          if (saved) setAvatar(saved);
        } catch (e) {}
        function handleAvatarFile(f) {
          if (!f) return;
          if (!f.type.startsWith("image/")) {
            toast("Please choose an image file.");
            return;
          }
          const r = new FileReader();
          r.onload = () => {
            const im = new Image();
            im.onload = () => {
              const sc = Math.min(
                1,
                800 / Math.max(im.naturalWidth, im.naturalHeight),
              );
              const c = document.createElement("canvas");
              c.width = Math.round(im.naturalWidth * sc);
              c.height = Math.round(im.naturalHeight * sc);
              c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
              const data = c.toDataURL("image/jpeg", 0.92);
              try {
                localStorage.setItem(AVKEY, data);
              } catch (err) {}
              setAvatar(data);
            };
            im.onerror = () => toast("Couldn't read that photo.");
            im.src = r.result;
          };
          r.readAsDataURL(f);
        }
        document.getElementById("avFile").addEventListener("change", (e) => {
          handleAvatarFile(e.target.files[0]);
          e.target.value = "";
        });
        // stop the browser opening a file that is dropped outside a drop zone
        ["dragover", "drop"].forEach((ev) =>
          window.addEventListener(ev, (e) => {
            if (e.dataTransfer && [...e.dataTransfer.types].includes("Files"))
              e.preventDefault();
          }),
        );
        document.getElementById("avClear").addEventListener("click", () => {
          avImg = null;
          try {
            localStorage.removeItem(AVKEY);
          } catch (e) {}
          const t = document.getElementById("avThumb");
          t.style.background = "";
          t.innerHTML = USER_ICON;
          document.getElementById("avTitle").textContent =
            "Upload profile photo";
          document.getElementById("avFile").value = "";
          render();
        });

        /* ---------- theme presets ---------- */
        const THEMES = [
          {
            n: "Classic",
            bg: "#f6f4ef",
            ink: "#0d0d0d",
            dcol: "#666666",
            pill: "#e9e7e2",
            acc: "#8a8780",
          },
          {
            n: "Midnight",
            bg: "#0e0e10",
            ink: "#ffffff",
            dcol: "#a1a1aa",
            pill: "#26262b",
            acc: "#8b8bff",
          },
          {
            n: "Ocean",
            bg: "#eaf3fb",
            ink: "#0b2540",
            dcol: "#4a6a86",
            pill: "#d3e5f5",
            acc: "#2f80ed",
          },
          {
            n: "Mint",
            bg: "#ecf6f0",
            ink: "#0d2b1d",
            dcol: "#4f6b5d",
            pill: "#d5eadd",
            acc: "#16a34a",
          },
          {
            n: "Sunset",
            bg: "#fff3ea",
            ink: "#2b1308",
            dcol: "#7a5a49",
            pill: "#ffe0cc",
            acc: "#f97316",
          },
          {
            n: "Rose",
            bg: "#fdeff2",
            ink: "#3a0f1c",
            dcol: "#8a5a68",
            pill: "#f9d5de",
            acc: "#e11d48",
          },
          {
            n: "Lavender",
            bg: "#f3f0fb",
            ink: "#1d1240",
            dcol: "#6a608c",
            pill: "#e1daf5",
            acc: "#7c3aed",
          },
          {
            n: "Gold",
            bg: "#14120d",
            ink: "#f5efe0",
            dcol: "#a69f8c",
            pill: "#2a261b",
            acc: "#e0b24a",
          },
        ];
        const themesEl = document.getElementById("themes");
        THEMES.forEach((t) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "theme";
          b.innerHTML =
            '<i style="background:' +
            t.bg +
            ";color:" +
            t.ink +
            '">Aa <em style="color:' +
            t.acc +
            '">Aa</em></i>' +
            t.n;
          b.addEventListener("click", () => {
            S.bg = t.bg;
            S.ink = t.ink;
            S.dcol = t.dcol;
            S.pill = t.pill;
            S.acc = t.acc;
            save();
            syncControls();
            render();
            markTheme();
          });
          themesEl.appendChild(b);
        });

        function markTheme() {
          [...themesEl.children].forEach((b, i) => {
            const t = THEMES[i];
            const on =
              t.bg === S.bg &&
              t.ink === S.ink &&
              t.acc === S.acc &&
              t.pill === S.pill;
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", on);
          });
        }
        markTheme();
        document
          .querySelectorAll('input[type="color"]')
          .forEach((el) => el.addEventListener("input", markTheme));

        /* ---------- reset ---------- */
        document.getElementById("reset").addEventListener("click", () => {
          S = Object.assign({}, DEFAULTS);
          save();
          syncControls();
          markTheme();
          render();
          toast("Settings reset");
        });

        /* ---------- download ---------- */
        document.getElementById("dl").addEventListener("click", async () => {
          const btn = document.getElementById("dl");
          const label = btn.querySelector("span");
          btn.disabled = true;
          label.textContent = "Preparing…";
          await fontsReady;
          await new Promise((r) => setTimeout(r, 30));
          const k = +S.exp || 2;
          const c = document.createElement("canvas");
          c.width = W * k;
          c.height = H * k;
          draw(c.getContext("2d"), k);
          const jpg = S.fmt === "jpg";
          const slug =
            (S.title || "design-post")
              .trim()
              .replace(/\s+/g, "-")
              .replace(/[^a-z0-9\-]/gi, "")
              .replace(/-+/g, "-")
              .replace(/^-|-$/g, "")
              .toLowerCase() || "design-post";
          // JPG has no transparency; the canvas is fully painted so this is safe
          c.toBlob(
            (blob) => {
              btn.disabled = false;
              label.textContent = "Download post image";
              if (!blob) {
                toast("Export failed. Try a lower export quality.");
                return;
              }
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = `postin-${slug.slice(0, 40)}-${W * k}x${H * k}.${jpg ? "jpg" : "png"}`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(a.href), 2000);
              toast("Downloaded " + a.download);
            },
            jpg ? "image/jpeg" : "image/png",
            0.96,
          );
        });

        render();
      })();
    </script>
  </body>
</html>
