    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/pjs-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/pjs-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/pjs-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url("/fonts/pjs-800.woff2") format("woff2");
      }
      :root {
        --bg: #f1efea;
        --panel: #ffffff;
        --ink: #111;
        --muted: #6b6b6b;
        --line: #e4e1da;
        --accent: #111;
        --font:
          "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI",
          Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        padding: clamp(12px, 2vw, 32px);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .app {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 560px);
        gap: clamp(20px, 3vw, 48px);
        align-items: start;
      }
      .preview {
        position: sticky;
        top: clamp(12px, 2vw, 32px);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
      }
      .frame {
        /* canvas is 4:5 — size it so the whole post always fits the screen height */
        width: min(100%, calc((100vh - 110px - 4vw) * 0.8 + 24px));
        width: min(100%, calc((100dvh - 110px - 4vw) * 0.8 + 24px));
      }
      .frame {
        background: #fff;
        border-radius: 14px;
        padding: 12px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 12px 40px rgba(0, 0, 0, 0.08);
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
        text-align: center;
        margin: 10px 0 0;
      }
      .panel {
        background: var(--panel);
        border-radius: 14px;
        padding: 26px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 22px;
      }
      label.f {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      input[type="text"],
      textarea,
      select {
        width: 100%;
        font: inherit;
        font-size: 15px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfaf8;
        color: var(--ink);
        outline: none;
      }
      textarea {
        resize: vertical;
        min-height: 92px;
        line-height: 1.5;
      }
      input[type="text"]:focus,
      textarea:focus,
      select:focus {
        border-color: #111;
        background: #fff;
      }
      .drop {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1.5px dashed #c9c5bb;
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        background: #fbfaf8;
        transition: 0.15s;
      }
      .drop:hover,
      .drop.over {
        border-color: #111;
        background: #fff;
      }
      .drop .ic {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #111;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        flex: none;
      }
      .drop b {
        display: block;
        font-size: 14px;
      }
      .drop span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .drop input {
        display: none;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .range {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .range input {
        flex: 1;
        accent-color: #111;
      }
      .range output {
        font-size: 12.5px;
        color: var(--muted);
        min-width: 42px;
        text-align: right;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
        margin-top: 16px;
        cursor: pointer;
      }
      .check input {
        width: 17px;
        height: 17px;
        accent-color: #111;
      }
      details {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 0;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "+";
        float: right;
        font-weight: 400;
        font-size: 18px;
      }
      details[open] summary::after {
        content: "–";
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        border-radius: 12px;
        padding: 14px 22px;
        cursor: pointer;
        border: 1px solid #111;
      }
      .btn-main {
        background: #111;
        color: #fff;
        flex: 1;
        min-width: 200px;
      }
      .btn-main:hover {
        background: #2a2a2a;
      }
      .btn-ghost {
        background: #fff;
        color: #111;
        border-color: var(--line);
      }
      .btn-ghost:hover {
        border-color: #111;
      }
      button:focus-visible,
      summary:focus-visible,
      .drop:focus-visible {
        outline: 2px solid #111;
        outline-offset: 2px;
      }
      .small {
        font-size: 12.5px;
        padding: 8px 12px;
        border-radius: 9px;
      }
      .inline {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .avthumb {
        border-radius: 50% !important;
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      .panel {
        min-width: 0;
      }
      .colors {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .themes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
      }
      .theme {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
        text-align: left;
        min-width: 0;
      }
      .theme:hover {
        border-color: #111;
      }
      .theme i {
        display: block;
        height: 44px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        font-style: normal;
        font-weight: 800;
        font-size: 17px;
        line-height: 44px;
        text-align: center;
        letter-spacing: -0.02em;
      }
      .theme i em {
        font-style: normal;
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfaf8;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        min-width: 0;
      }
      .swatch:hover {
        border-color: #111;
      }
      .swatch input[type="color"] {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        cursor: pointer;
        flex: none;
      }
      .swatch input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .swatch input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 7px;
      }
      .swatch input[type="color"]::-moz-color-swatch {
        border: 0;
        border-radius: 7px;
      }
      .swatch span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      img,
      canvas {
        max-width: 100%;
      }

      /* tablet + mobile: single column, preview on top */
      @media (max-width: 1000px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
          max-width: 720px;
        }
        .preview {
          position: static;
        }
        .frame {
          width: 100%;
        }
        .panel {
          padding: 22px;
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }
        .frame {
          padding: 8px;
          border-radius: 12px;
        }
        .panel {
          padding: 18px 16px;
          border-radius: 12px;
        }
        h1 {
          font-size: 20px;
        }
        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
        /* 16px inputs stop iOS from zooming on focus */
        input[type="text"],
        textarea,
        select {
          font-size: 16px;
        }
        .actions {
          flex-direction: column;
        }
        .btn-main,
        .btn-ghost {
          width: 100%;
          min-width: 0;
        }
        button {
          padding: 15px 18px;
        }
      }
      @media (hover: none) {
        .range input {
          height: 28px;
        }
      }

      /* ---------- Postin additions ---------- */
      .skip {
        position: absolute;
        left: -9999px;
        top: 8px;
        background: #111;
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        z-index: 10;
        font-size: 14px;
      }
      .skip:focus {
        left: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 6px;
      }
      .brand img {
        width: 40px;
        height: 40px;
        flex: none;
        display: block;
      }
      .brand h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .ico {
        width: 1em;
        height: 1em;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .drop .ic .ico {
        width: 22px;
        height: 22px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }
      button .ico {
        width: 18px;
        height: 18px;
      }
      button:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .theme.active {
        border-color: #111;
        box-shadow: 0 0 0 1px #111;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        background: #111;
        color: #fff;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 20;
        max-width: calc(100vw - 32px);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      /* ---------- template switcher ---------- */
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: #f1efea;
        padding: 5px;
        border-radius: 14px;
        margin: 0 0 6px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        padding: 12px 10px;
        border-radius: 10px;
      }
      .seg button:hover {
        color: #111;
      }
      .seg button[aria-selected="true"] {
        background: #111;
        color: #fff;
      }
      body[data-t="post"] [data-tpl="cover"],
      body[data-t="cover"] [data-tpl="post"] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* ---------- v3 organised UI ---------- */
      .panel {
        --pad: 26px;
        padding: var(--pad);
      }
      .phead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .phead .brand {
        margin: 0;
      }
      .sub {
        margin: 8px 0 16px;
      }
      .hn {
        font-weight: 400;
        color: #8a867c;
      }
      details.sec {
        margin: 10px 0 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        overflow: hidden;
      }
      details.sec[open] {
        border-color: #d6d2c7;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      details.sec > summary {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 14px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: #fbfaf8;
        user-select: none;
      }
      details.sec[open] > summary {
        border-bottom: 1px solid var(--line);
      }
      details.sec > summary::after {
        content: "";
        float: none;
        margin-left: auto;
        width: 8px;
        height: 8px;
        border-right: 2px solid #8a867c;
        border-bottom: 2px solid #8a867c;
        transform: rotate(45deg) translateY(-2px);
        transition: transform 0.2s;
      }
      details.sec[open] > summary::after {
        content: "";
        transform: rotate(-135deg) translate(-2px, -2px);
      }
      .si {

    <script>
      (function () {
        const W = 1080,
          H = 1350;
        const FONT =
          "'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif";
        const FONT_T =
          "'Inter Tight', 'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif";
        const FONT_I =
          "'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif";

        const DEFAULTS = {
          cat: "",
          title: "",
          desc: "",
          tl: "",
          tr: "",
          handle: "",
          bg: "#f6f4ef",
          ink: "#0d0d0d",
          dcol: "#666666",
          pill: "#e9e7e2",
          acc: "#8a8780",
          tone: "off",
          fit: "fill",
          valign: "center",
          blend: true,
          scale: 100,
          offy: 0,
          tsize: 70,
          avzoom: 100,
          exp: "2",
          fmt: "png",
          /* cover template */
          tpl: "post",
          ctitle: "Build This\nApp",
          ctsize: 164,
          csub: "in [1-4] Weeks",
          cline: true,
          cshowphone: true,
          pscale: 100,
          poffy: 0,
          iscale: 100,
          ioffy: 0,
          cphone: "silver",
          cgrain: true,
          cbg: "#f1f1ef",
          cink: "#0a0a0a",
          cdcol: "#6b6b6b",
          cpill: "#e8edfb",
          cacc: "#4a6ee0",
          role: "",
          swipe: "Swipe",
          csubacc: "#4a6ee0",
          clinecol: "#4a6ee0",
          cbgrem: true,
          _v: 2,
          cswipe: true,
        };
        const PCT = ["scale", "avzoom", "pscale", "iscale"];

        /* ---------- storage (safe) ---------- */
        const KEY = "postin_settings_v1",
          AVKEY = "postin_avatar_v1",
          OLDKEY = "igpost_template_v2",
          OLDAVKEY = "igpost_template_avatar";
        // migrate settings saved by the previous version
        try {
          if (!localStorage.getItem(KEY) && localStorage.getItem(OLDKEY))
            localStorage.setItem(KEY, localStorage.getItem(OLDKEY));
          if (!localStorage.getItem(AVKEY) && localStorage.getItem(OLDAVKEY))
            localStorage.setItem(AVKEY, localStorage.getItem(OLDAVKEY));
        } catch (e) {}
        const USER_ICON =
          '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
        function toast(msg) {
          const t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(() => t.classList.remove("show"), 2600);
        }
        function load() {
          try {
            return JSON.parse(localStorage.getItem(KEY)) || {};
          } catch (e) {
            return {};
          }
        }
        function save() {
          try {
            localStorage.setItem(KEY, JSON.stringify(S));
          } catch (e) {}
        }

        const saved0 = load();
        if (saved0._v !== 2)
          [
            "ctitle",
            "ctsize",
            "csub",
            "role",
            "pscale",
            "poffy",
            "iscale",
            "ioffy",
          ].forEach((k) => delete saved0[k]);
        let S = Object.assign({}, DEFAULTS, saved0, { _v: 2 });
        let uiImg = null,
          uiCv = null,
          avImg = null;

        const cv = document.getElementById("cv");
        const ctx = cv.getContext("2d");

        /* ---------- helpers ---------- */
        function rr(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y);
          c.arcTo(x + w, y, x + w, y + h, r);
          c.arcTo(x + w, y + h, x, y + h, r);

          c.arcTo(x, y, x + w, y, r);

        function wrap(c, text, maxW) {
          const out = [];
          String(text)
            .split("\n")
            .forEach((par) => {
              const words = par.split(/\s+/).filter(Boolean);
              if (!words.length) {
                out.push("");
                return;
              }
              let line = words[0];
              for (let i = 1; i < words.length; i++) {
                const t = line + " " + words[i];
                if (c.measureText(t).width <= maxW) line = t;
                else {
                  out.push(line);
                  line = words[i];
                }
              }
              out.push(line);
            });
          return out;
        }
        // title tokens: words wrapped in [brackets] get the highlight color
        function parseTitle(text) {
          const paras = [];
          let acc = false;
          String(text)
            .split("\n")
            .forEach((p) => {
              const toks = [];
              let cur = "";
              const flush = () => {
                if (cur) {
                  toks.push({ w: cur, acc: acc });
                  cur = "";
                }
              };
              for (const ch of p) {
                if (ch === "[") {
                  flush();
                  acc = true;
                } else if (ch === "]") {
                  flush();
                  acc = false;
                } else if (/\s/.test(ch)) flush();
                else cur += ch;
              }
              flush();
              paras.push(toks);
            });
          return paras;
        }
        function wrapTokens(c, paras, maxW) {
          const lines = [];
          paras.forEach((toks) => {
            if (!toks.length) {
              lines.push([]);
              return;
            }
            let line = [toks[0]];
            for (let i = 1; i < toks.length; i++) {
              const t = line
                .concat(toks[i])
                .map((o) => o.w)
                .join(" ");
              if (c.measureText(t).width <= maxW) line.push(toks[i]);
              else {
                lines.push(line);
                line = [toks[i]];
              }
            }
            lines.push(line);
          });
          return lines;
        }
        // balanced wrap: same line count as greedy, but lines are evenly sized
        function balancedWrap(c, text, maxW) {
          const base = wrap(c, text, maxW);
          if (base.length < 2) return base;
          const n = base.length;
          let lo = maxW * 0.5,
            hi = maxW,
            best = base;
          for (let i = 0; i < 14; i++) {
            const mid = (lo + hi) / 2;
            const t = wrap(c, text, mid);
            if (t.length <= n) {
              best = t;
              hi = mid;
            } else lo = mid;
          }
          return best;
        }

          let s = 1234567;
          for (let i = 0; i < id.data.length; i += 4) {

            const v = s >>> 24;
            id.data[i] = id.data[i + 1] = id.data[i + 2] = v;

          c.fillStyle = col;
          c.beginPath();
          for (let i = 0; i <= N; i++) {
            const t = i / N;
            c.lineTo(x0 + w * t, yAt(t) - thick(t) / 2);
          }
          for (let i = N; i >= 0; i--) {
            const t = i / N;
            c.lineTo(x0 + w * t, yAt(t) + thick(t) / 2);
          }
          c.closePath();

        let raf = 0;
        function render() {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            draw(ctx, 1, true);
          });
        }

        /* ---------- fonts ---------- */
        let fontsReady = Promise.resolve();
        if (document.fonts && document.fonts.load) {
          fontsReady = Promise.all([
            document.fonts.load(`400 25px 'Plus Jakarta Sans'`),
            document.fonts.load(`500 25px 'Plus Jakarta Sans'`),
            document.fonts.load(`600 30px 'Plus Jakarta Sans'`),
            document.fonts.load(`800 70px 'Plus Jakarta Sans'`),
            document.fonts.load(`800 164px 'Inter Tight'`).catch(() => {}),
            document.fonts.load(`400 20px 'Inter'`).catch(() => {}),
            document.fonts.load(`500 66px 'Inter'`).catch(() => {}),
            document.fonts.load(`600 21px 'Inter'`).catch(() => {}),
          ])
            .then(render)
            .catch(() => {});
          document.fonts.ready.then(render);
        }

        /* ---------- bind controls ---------- */
        document.querySelectorAll("[data-k]").forEach((el) => {
          const k = el.dataset.k;
          if (el.type === "checkbox") el.checked = !!S[k];
          else el.value = S[k];
          const out = document.getElementById(el.id + "O");
          const upd = () => {
            if (out)
              out.textContent = PCT.includes(k)
                ? el.value + "%"
                : el.value + (k === "tsize" || k === "ctsize" ? "px" : "");
          };
          upd();
          const handler = () => {
            S[k] =
              el.type === "checkbox"
                ? el.checked
                : el.type === "range"
                  ? +el.value
                  : el.value;
            upd();
            save();
            render();
          };
          el.addEventListener("input", handler);
          el.addEventListener("change", handler);
        });

        function syncControls() {
          document.querySelectorAll("[data-k]").forEach((el) => {
            const k = el.dataset.k;
            if (el.type === "checkbox") el.checked = !!S[k];
            else el.value = S[k];
            const out = document.getElementById(el.id + "O");
            if (out)
              out.textContent = PCT.includes(k)
                ? el.value + "%"
                : el.value + (k === "tsize" || k === "ctsize" ? "px" : "");
          });
        }

        /* ---------- image loading ---------- */
        function loadImageFile(file, cb) {
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            toast("Please choose an image file (PNG, JPG or WebP).");
            return;
          }
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            cb(img, file);
            URL.revokeObjectURL(url);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            toast("Couldn't read that image. Try another file.");
          };
          img.src = url;
        }

        const uiFile = document.getElementById("uiFile");
        const drop = document.getElementById("drop");
        const dropTitle = document.getElementById("dropTitle");
        function setUI(file) {
          loadImageFile(file, (img, f) => {
            uiImg = img;
            dropTitle.textContent =
              f.name.length > 34 ? f.name.slice(0, 31) + "…" : f.name;
            render();
          });
        }
        uiFile.addEventListener("change", (e) => {
          setUI(e.target.files[0]);
          e.target.value = "";
        });
        ["dragenter", "dragover"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          drop.addEventListener(ev, (e) => {
            e.preventDefault();
            drop.classList.remove("over");
          }),
        );
        drop.addEventListener("drop", (e) => setUI(e.dataTransfer.files[0]));
        drop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            uiFile.click();
          }
        });

        // profile photo (kept in this browser)
        const avDrop = document.getElementById("avDrop");
        ["dragenter", "dragover"].forEach((ev) =>
          avDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            avDrop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          avDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            avDrop.classList.remove("over");
          }),
        );
        avDrop.addEventListener("drop", (e) =>
          handleAvatarFile(e.dataTransfer.files[0]),
        );
        avDrop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            document.getElementById("avFile").click();
          }
        });
        function setAvatar(dataUrl) {
          const img = new Image();
          img.onload = () => {
            avImg = img;
            const t = document.getElementById("avThumb");
            t.textContent = "";
            t.style.background = "url(" + dataUrl + ") center/cover";
            document.getElementById("avTitle").textContent =
              "Change profile photo";
            render();
          };
          img.src = dataUrl;
        }
        try {
          const saved = localStorage.getItem(AVKEY);
          if (saved) setAvatar(saved);
        } catch (e) {}
        function handleAvatarFile(f) {
          if (!f) return;
          if (!f.type.startsWith("image/")) {
            toast("Please choose an image file.");
            return;
          }
          const r = new FileReader();
          r.onload = () => {
            const im = new Image();
            im.onload = () => {
              const sc = Math.min(
                1,
                800 / Math.max(im.naturalWidth, im.naturalHeight),
              );
              const c = document.createElement("canvas");
              c.width = Math.round(im.naturalWidth * sc);
              c.height = Math.round(im.naturalHeight * sc);
              c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
              const data = c.toDataURL("image/jpeg", 0.92);
              try {
                localStorage.setItem(AVKEY, data);
              } catch (err) {}
              setAvatar(data);
            };
            im.onerror = () => toast("Couldn't read that photo.");
            im.src = r.result;
          };
          r.readAsDataURL(f);
        }
        document.getElementById("avFile").addEventListener("change", (e) => {
          handleAvatarFile(e.target.files[0]);
          e.target.value = "";
        });
        // stop the browser opening a file that is dropped outside a drop zone
        ["dragover", "drop"].forEach((ev) =>
          window.addEventListener(ev, (e) => {
            if (e.dataTransfer && [...e.dataTransfer.types].includes("Files"))
              e.preventDefault();
          }),
        );
        document.getElementById("avClear").addEventListener("click", () => {
          avImg = null;
          try {
            localStorage.removeItem(AVKEY);
          } catch (e) {}
          const t = document.getElementById("avThumb");
          t.style.background = "";
          t.innerHTML = USER_ICON;
          document.getElementById("avTitle").textContent =
            "Upload profile photo";
          document.getElementById("avFile").value = "";
          render();
        });

        /* ---------- cover phone image drop zone ---------- */
        const cvFile = document.getElementById("cvFile");
        const cvDrop = document.getElementById("cvDrop");
        const cvDropTitle = document.getElementById("cvDropTitle");
        let uiCvRaw = null;
        // draws the mockup into a canvas, removes the flat outer background
        // (flood fill from the edges) and crops to the phone
        function processMock(img, remove) {
          const sc = Math.min(
            1,
            3200 / Math.max(img.naturalWidth, img.naturalHeight),
          );
          const w = Math.round(img.naturalWidth * sc),
            h = Math.round(img.naturalHeight * sc);
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(img, 0, 0, w, h);
          if (!remove) return c;
          const id = x.getImageData(0, 0, w, h),
            d = id.data;
          const br = d[0],
            bg = d[1],
            bb = d[2],
            T = 3;
          const isBg = (i) =>
            Math.abs(d[i] - br) <= T &&
            Math.abs(d[i + 1] - bg) <= T &&
            Math.abs(d[i + 2] - bb) <= T;
          if (d[3] >= 10) {
            const seen = new Uint8Array(w * h),
              st = new Int32Array(w * h);
            let sp = 0;
            const push = (p) => {
              if (!seen[p] && isBg(p * 4)) {
                seen[p] = 1;
                st[sp++] = p;
              }
            };
            for (let i = 0; i < w; i++) {
              push(i);
              push((h - 1) * w + i);
            }
            for (let j = 0; j < h; j++) {
              push(j * w);
              push(j * w + w - 1);
            }
            while (sp) {
              const p = st[--sp];
              d[p * 4 + 3] = 0;
              const px = p % w;
              if (px > 0) push(p - 1);
              if (px < w - 1) push(p + 1);
              if (p >= w) push(p - w);
              if (p < w * (h - 1)) push(p + w);
            }
          }
          let x0 = w,
            y0 = h,
            x1 = -1,
            y1 = -1;
          for (let j = 0; j < h; j++)
            for (let i = 0; i < w; i++)
              if (d[(j * w + i) * 4 + 3] > 8) {
                if (i < x0) x0 = i;
                if (i > x1) x1 = i;
                if (j < y0) y0 = j;
                if (j > y1) y1 = j;
              }
          if (x1 < 0) return c;
          x.putImageData(id, 0, 0);
          const o = document.createElement("canvas");
          o.width = x1 - x0 + 1;
          o.height = y1 - y0 + 1;
          o.getContext("2d").drawImage(
            c,
            x0,
            y0,
            o.width,
            o.height,
            0,
            0,
            o.width,
            o.height,
          );
          return o;
        }
        document.getElementById("cbgrem").addEventListener("change", () => {
          if (uiCvRaw) {
            uiCv = processMock(uiCvRaw, S.cbgrem);
            render();
          }
        });
        function setCover(file) {
          loadImageFile(file, (img, f) => {
            uiCvRaw = img;
            uiCv = processMock(img, S.cbgrem);
            cvDropTitle.textContent =
              f.name.length > 34 ? f.name.slice(0, 31) + "…" : f.name;
            render();
          });
        }
        cvFile.addEventListener("change", (e) => {
          setCover(e.target.files[0]);
          e.target.value = "";
        });
        ["dragenter", "dragover"].forEach((ev) =>
          cvDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            cvDrop.classList.add("over");
          }),
        );
        ["dragleave", "drop"].forEach((ev) =>
          cvDrop.addEventListener(ev, (e) => {
            e.preventDefault();
            cvDrop.classList.remove("over");
          }),
        );
        cvDrop.addEventListener("drop", (e) =>
          setCover(e.dataTransfer.files[0]),
        );
        cvDrop.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            cvFile.click();
          }
        });

        /* ---------- theme presets ---------- */
        const THEMES = [
          {
            n: "Classic",
            bg: "#f6f4ef",
            ink: "#0d0d0d",
            dcol: "#666666",
            pill: "#e9e7e2",
            acc: "#8a8780",
          },
          {
            n: "Midnight",
            bg: "#0e0e10",
            ink: "#ffffff",
            dcol: "#a1a1aa",
            pill: "#26262b",
            acc: "#8b8bff",
          },
          {
            n: "Ocean",
            bg: "#eaf3fb",
            ink: "#0b2540",
            dcol: "#4a6a86",
            pill: "#d3e5f5",
            acc: "#2f80ed",
          },
          {
            n: "Mint",
            bg: "#ecf6f0",
            ink: "#0d2b1d",
            dcol: "#4f6b5d",
            pill: "#d5eadd",
            acc: "#16a34a",
          },
          {
            n: "Sunset",
            bg: "#fff3ea",
            ink: "#2b1308",
            dcol: "#7a5a49",
            pill: "#ffe0cc",
            acc: "#f97316",
          },
          {
            n: "Rose",
            bg: "#fdeff2",
            ink: "#3a0f1c",
            dcol: "#8a5a68",
            pill: "#f9d5de",
            acc: "#e11d48",
          },
          {
            n: "Lavender",
            bg: "#f3f0fb",
            ink: "#1d1240",
            dcol: "#6a608c",
            pill: "#e1daf5",
            acc: "#7c3aed",
          },
          {
            n: "Gold",
            bg: "#14120d",
            ink: "#f5efe0",
            dcol: "#a69f8c",
            pill: "#2a261b",
            acc: "#e0b24a",
          },
        ];
        const COVER_THEMES = THEMES.map((t, i) =>
          i === 0
            ? {
                n: "Paper",
                bg: "#f1f1ef",
                ink: "#0a0a0a",
                dcol: "#6b6b6b",
                pill: "#e8edfb",
                acc: "#4a6ee0",
              }
            : t,
        );
        const KM = {
          post: {
            bg: "bg",
            ink: "ink",
            dcol: "dcol",
            pill: "pill",
            acc: "acc",
          },
          cover: {
            bg: "cbg",
            ink: "cink",
            dcol: "cdcol",
            pill: "cpill",
            acc: "cacc",
          },
        };
        const curT = () => (S.tpl === "cover" ? "cover" : "post");
        const curThemes = () => (curT() === "cover" ? COVER_THEMES : THEMES);
        const themesEl = document.getElementById("themes");

        function buildThemes() {
          themesEl.innerHTML = "";
          curThemes().forEach((t) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "theme";
            b.innerHTML =
              '<i style="background:' +
              t.bg +
              ";color:" +
              t.ink +
              '">Aa <em style="color:' +
              t.acc +
              '">Aa</em></i>' +
              t.n;
            b.addEventListener("click", () => {
              const m = KM[curT()];
              S[m.bg] = t.bg;
              S[m.ink] = t.ink;
              S[m.dcol] = t.dcol;
              S[m.pill] = t.pill;
              S[m.acc] = t.acc;
              if (curT() === "cover") {
                S.csubacc = t.acc;
                S.clinecol = t.acc;
              }
              save();
              syncControls();
              render();
              markTheme();
            });
            themesEl.appendChild(b);
          });
        }

        function markTheme() {
          const m = KM[curT()];
          const list = curThemes();
          [...themesEl.children].forEach((b, i) => {
            const t = list[i];
            const on =
              t.bg === S[m.bg] &&
              t.ink === S[m.ink] &&
              t.acc === S[m.acc] &&
              t.pill === S[m.pill];
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", on);
          });
        }
        document
          .querySelectorAll('input[type="color"]')
          .forEach((el) => el.addEventListener("input", markTheme));

        /* ---------- template switching ---------- */
        const tabs = [...document.querySelectorAll("[data-template]")];
        function setTemplate(t, persist) {
          S.tpl = t === "cover" ? "cover" : "post";
          document.body.dataset.t = S.tpl;
          tabs.forEach((b) =>
            b.setAttribute("aria-selected", b.dataset.template === S.tpl),
          );
          cv.setAttribute(
            "aria-label",
            S.tpl === "cover"
              ? "Live preview of your 4:5 Instagram cover"
              : "Live preview of your 4:5 Instagram post",
          );
          buildThemes();
          markTheme();
          if (persist) save();
          render();
        }
        tabs.forEach((b) =>
          b.addEventListener("click", () =>
            setTemplate(b.dataset.template, true),
          ),
        );
        setTemplate(S.tpl, false);

        /* ---------- reset ---------- */
        document.getElementById("reset").addEventListener("click", () => {
          S = Object.assign({}, DEFAULTS, { tpl: S.tpl });
          save();
          syncControls();
          markTheme();
          render();
          toast("Settings reset");
        });

        /* ---------- download ---------- */
        document.getElementById("dl").addEventListener("click", async () => {
          const btn = document.getElementById("dl");
          const label = btn.querySelector("span");
          btn.disabled = true;
          label.textContent = "Preparing…";
          await fontsReady;
          await new Promise((r) => setTimeout(r, 30));
          const k = +S.exp || 2;
          const c = document.createElement("canvas");
          c.width = W * k;
          c.height = H * k;
          draw(c.getContext("2d"), k);
          const jpg = S.fmt === "jpg";
          const slug =
            ((S.tpl === "cover" ? S.ctitle : S.title) || "design-post")
              .trim()
              .replace(/\s+/g, "-")
              .replace(/[^a-z0-9\-]/gi, "")
              .replace(/-+/g, "-")
              .replace(/^-|-$/g, "")
              .toLowerCase() || "design-post";
          // JPG has no transparency; the canvas is fully painted so this is safe
          c.toBlob(
            (blob) => {
              btn.disabled = false;
              label.textContent = "Download post image";
              if (!blob) {
                toast("Export failed. Try a lower export quality.");
                return;
              }
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = `postin-${slug.slice(0, 40)}-${W * k}x${H * k}.${jpg ? "jpg" : "png"}`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(a.href), 2000);
              toast("Downloaded " + a.download);
            },
            jpg ? "image/jpeg" : "image/png",
            0.96,
          );
        });

        render();
      })();
    </script>
  </body>
</html>
